<!-- Toast Messages -->
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
</div>

<script>
    function showToast(message, type = 'info', confirmCallback = null) {
        const toastContainer = document.getElementById('toast-container');

        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.style = `
            min-width: 200px;
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        `;

        // Set background color based on type
        switch (type) {
            case 'success':
                toast.style.backgroundColor = '#28a745';
                break;
            case 'warning':
                toast.style.backgroundColor = '#ffc107';
                break;
            case 'error':
                toast.style.backgroundColor = '#dc3545';
                break;
            default:
                toast.style.backgroundColor = '#007bff';
        }

        if (confirmCallback) {
            toast.innerHTML = `
                <span>${message}</span>
                <div>
                    <button style="background: none; border: none; color: white; font-size: 14px; cursor: pointer; margin-right: 10px;" onclick="(${confirmCallback})(); this.parentElement.parentElement.remove()">Confirm</button>
                    <button style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;" onclick="this.parentElement.parentElement.remove()">&times;</button>
                </div>
            `;
        } else {
            toast.innerHTML = `
                <span>${message}</span>
                <button style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;" onclick="this.parentElement.remove()">&times;</button>
            `;

            // Auto-remove toast after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        toastContainer.appendChild(toast);
    }
</script>
